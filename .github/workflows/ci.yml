name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install System Dependencies (FFmpeg & espeak-ng)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng

      - name: Check Formatting
        run: cargo fmt --all -- --check

      - name: Validate Web UI Scripts (JavaScript Syntax)
        run: |
          node -e '
          const fs = require("fs");
          for (const file of ["docs/index.html", "docs/studio.html"]) {
            if (!fs.existsSync(file)) continue;
            const html = fs.readFileSync(file, "utf8");
            const scripts = html.match(/<script[\s\S]*?<\/script>/gi) || [];
            scripts.forEach((s, i) => {
              const code = s.replace(/<script[^>]*>/i, "").replace(/<\/script>/i, "");
              try {
                new Function(code);
                console.log(`${file} - Script ${i} syntax valid`);
              } catch (err) {
                console.error(`${file} - Script ${i} syntax error:`, err);
                process.exit(1);
              }
            });
          }
          '

      - name: Run Clippy Linter
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Unit Tests
        run: cargo test --workspace --verbose
