name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Release Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Build Release
        run: cargo build --release

      - name: Package Tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="Audioticon-${VERSION}-linux-x86_64"
          mkdir -p "dist/${PKG_NAME}"
          cp target/release/audioticon "dist/${PKG_NAME}/audioticon" 2>/dev/null || cp target/release/audioticon-cli "dist/${PKG_NAME}/audioticon"
          ln -sf audioticon "dist/${PKG_NAME}/audioticon-cli" 2>/dev/null || true
          cp audioticon.example.toml "dist/${PKG_NAME}/"
          cp scripts/setup.sh "dist/${PKG_NAME}/"
          cp LICENSE-MIT LICENSE-APACHE README.md THIRD_PARTY_NOTICES.md "dist/${PKG_NAME}/"
          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c062e08bd532815e2082a85e87e3ef29c3e6d191 # v2.0.8
        with:
          files: |
            dist/Audioticon-*.tar.gz
            dist/Audioticon-*.tar.gz.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
