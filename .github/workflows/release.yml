name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: audioticon
            asset_ext: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: audioticon.exe
            asset_ext: zip
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: audioticon
            asset_ext: tar.gz

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p audioticon-cli

      - name: Package Windows Binary (.zip)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="Audioticon-${VERSION}-windows-x86_64"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/audioticon.exe" "dist/${PKG_NAME}/Audioticon.exe"
          printf "@echo off\r\ntitle Audioticon Studio v1.0.0\r\necho Uruchamianie Audioticon Studio Workbench...\r\nstart http://127.0.0.1:3000\r\nAudioticon.exe\r\n" > "dist/${PKG_NAME}/Start_Audioticon.bat"
          cp docs/INSTRUKCJA_OBSLUGI.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cd dist
          7z a "${PKG_NAME}.zip" "${PKG_NAME}"
          certutil -hashfile "${PKG_NAME}.zip" SHA256 > "${PKG_NAME}.zip.sha256"

      - name: Package Unix Binary (.tar.gz)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          PKG_NAME="Audioticon-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "target/${{ matrix.target }}/release/audioticon" "dist/${PKG_NAME}/audioticon"
          chmod +x "dist/${PKG_NAME}/audioticon"
          cp docs/INSTRUKCJA_OBSLUGI.md "dist/${PKG_NAME}/" 2>/dev/null || true
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            cp scripts/setup.sh "dist/${PKG_NAME}/" 2>/dev/null || true
          fi
          cp LICENSE-MIT LICENSE-APACHE THIRD_PARTY_NOTICES.md README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cd dist
          tar -czvf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256" || sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_assets
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
          draft: false
          prerelease: false
          generate_release_notes: true
