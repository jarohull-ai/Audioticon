[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Jarosław Kuchta <jarohull@gmail.com>"]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
hound = "3.5"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
