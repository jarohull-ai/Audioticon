[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Jarosław Kuchta"]
repository = "https://github.com/jarohull-ai/Audioticon"
description = "Emoji-directed audiobook engine with sentence-level caching and DSP mastering"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
hound = "3.5"
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
dirs = { version = "5" }
tiny_http = "0.12"
